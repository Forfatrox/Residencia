<style>

@media(prefers-color-scheme:dark){:root{--bg:#111418;--c:#1b1f25;--t:#e8eaed;--m:#9aa3ad;--b:#2c323a;--a:#6d9bff;--ok:#4ade80;--ko:#f87171}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}

.bar{height:6px;background:var(--b);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--a)}
label{display:block;margin:8px 0 2px}select{width:100%}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
header b{flex:1;font-size:18px}.chip{background:#fff3;padding:4px 10px;border-radius:99px;font-weight:600;font-size:14px}header button{background:#fff3;border:0;color:#fff;padding:6px 10px}
.card{border-radius:16px;box-shadow:0 2px 10px #0000000d;animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}

@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bar{height:8px}.bar i{background:linear-gradient(90deg,#1d4ed8,#7c3aed);transition:width .4s}main{padding-bottom:90px}

.on{border-color:var(--a);color:var(--a);font-weight:700}.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}.chip.dim{opacity:.65}
header{flex-wrap:wrap}header b{font-size:16px;min-width:150px}button:disabled{opacity:.5}

.bn{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--c);border:1px solid var(--b);padding:10px 16px;border-radius:99px;z-index:20;box-shadow:0 6px 20px #0004;animation:up .3s}
.cf{position:fixed;top:-30px;z-index:20;font-style:normal;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
body{background:radial-gradient(circle at top right,color-mix(in srgb,var(--a) 12%,var(--bg)),var(--bg) 45%) fixed}
.ob{border:1px solid var(--b);background:var(--c);border-radius:12px;padding:12px 14px}textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);margin-top:8px}.rc{background:var(--a);color:#fff}

</style></head><body><header id="hd"></header><main id="app"></main><div id="pm"></div><div id="z"><img></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,Q=[],P={},V='home',S={};
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('bancomir',1);q.onupgradeneeded=()=>{q.result.createObjectStore('q',{keyPath:'id'});q.result.createObjectStore('p',{keyPath:'id'})};q.onsuccess=()=>{db=q.result;r()};q.onerror=j});
const all=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)});
const putMany=(s,a)=>new Promise(r=>{const t=db.transaction(s,'readwrite');a.forEach(v=>t.objectStore(s).put(v));t.oncomplete=r});
const delMany=(s,a)=>new Promise(r=>{const t=db.transaction(s,'readwrite');a.forEach(k=>t.objectStore(s).delete(k));t.oncomplete=r});
const load=async()=>{Q=await all('q');P={};(await all('p')).forEach(p=>P[p.id]=p)};
const blk=n=>{const b=Math.floor((n-1)/25)*25;return`${b+1}-${b+25}`};
const norm=(x,ex)=>{const n=+(x.numero??x.n)||0,e=x.examen||ex||'Sin examen',k=x.correcta??x.respuesta??null;return{id:x.id||`${e}_Q${n}`,examen:e,numero:n,esp:x.especialidad||'',en:x.enunciado||x.pregunta||'',op:x.opciones||[],ok:k,anulada:!!x.anulada||k==null,ex:x.explicacion||'',js:x.justificaciones||x.explicaciones||[],im:x.imagenes||(x.imagen?[x.imagen]:[])}};
const exams=()=>[...new Set(Q.map(q=>q.examen))].sort().reverse();
const pick=()=>Q.filter(q=>!q.anulada&&(S.e==='*'||q.examen===S.e)&&(!S.b||blk(q.numero)===S.b)&&(!S.s||q.esp===S.s)&&(S.f==='d'?due(q):S.f==='n'?!P[q.id]:S.f==='f'?P[q.id]&&!P[q.id].ok:true)).sort((a,b)=>a.examen.localeCompare(b.examen)||a.numero-b.numero);
function home(){let h='<button class="p" data-stats style="width:100%;margin-bottom:10px">📊 Estadísticas y calendario</button>';const ex=exams();
 if(!ex.length)h+='<div class="card m">Aún no hay preguntas. Importa un archivo JSON.</div>';
 ex.forEach(e=>{const qs=Q.filter(q=>q.examen===e&&!q.anulada),r=qs.filter(q=>P[q.id]),a=r.filter(q=>P[q.id].ok);
  h+=`<div class="card"><b>${esc(e)}</b><div class="m">${qs.length} preguntas · ${r.length} respondidas · ${a.length} aciertos · ${r.length-a.length} falladas</div><div class="bar"><i style="width:${qs.length?r.length/qs.length*100:0}%"></i></div><div class="row" style="margin-top:10px"><button class="p" data-study="${esc(e)}">Estudiar</button><button data-expq="${esc(e)}">⬇ Exportar</button><button data-del="${esc(e)}">Borrar</button></div></div>`});
 if(ex.length)h+='<button data-study="*">Repasar por especialidad (todos los exámenes)</button>';
 h+=catCard();let h2='<div class="card"><b>Importar preguntas</b><div class="m">Uno o varios archivos JSON. Se agrupan solos por examen.</div><p><input type="file" id="fq" accept=".json" multiple></p>'+(Q.length?'<button data-expq="">⬇ Exportar todas las preguntas (un solo archivo)</button>':'')+'</div>';
 h2+='<div class="card"><b>Respaldo del progreso</b> <span class="m">· v22</span><div class="m">Guarda respuestas, repaso espaciado, racha, meta diaria y ajustes del pomodoro y del sonido de fondo. Toca «Copiar progreso», pega el texto en un mensaje a ti mismo y, en el otro dispositivo, toca «Pegar progreso».</div><div class="row" style="margin-top:8px"><button class="p" data-cpy>📋 Copiar progreso</button><button data-pst>📥 Pegar progreso</button></div><div id="pbox"></div></div>';
 return tabs()+(T==='q'?h:goalCard()+revCard()+h2)}
function setup(){const base=Q.filter(q=>(S.e==='*'||q.examen===S.e)&&!q.anulada),bl=[...new Set(base.map(q=>blk(q.numero)))].sort((a,b)=>parseInt(a)-parseInt(b)),es=[...new Set(base.map(q=>q.esp).filter(Boolean))].sort();
 const sel=(k,o)=>`<select data-k="${k}">${o.map(([v,t])=>`<option value="${esc(v)}" ${(S[k]||'')===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
 return`<h1>${S.e==='*'?'Todos los exámenes':esc(S.e)}</h1><div class="card"><label>Bloque</label>${sel('b',[['','Todo'],...bl.map(b=>[b,'Preguntas '+b])])}<label>Especialidad</label>${sel('s',[['','Todas'],...es.map(x=>[x,x])])}<label>Estado</label>${sel('f',[['','Todas'],['n','Sin responder'],['f','Falladas'],['d','Para repasar hoy']])}<label><input type="checkbox" data-k="r" ${S.r?'checked':''}> Orden aleatorio</label><label><input type="checkbox" data-k="ar" ${S.ar?'checked':''}> 🧠 Recuerdo activo: primero respondes de memoria, sin ver las opciones</label><p class="m">${pick().length} preguntas con estos filtros (las anuladas se excluyen).</p><div class="row"><button data-home>Volver</button><button class="p" data-go>Empezar</button></div></div><div class="card"><b>⏱ Mini simulacro</b><div class="m">Con los filtros de arriba, cronometrado y sin ver respuestas hasta el final (~1,4 min por pregunta).</div><div class="row" style="margin-top:10px">${[10,20,30,50].map(n=>`<button class="${(S.n||10)===n?'on':''}" data-sn="${n}">${n}</button>`).join('')}<button class="p" data-sim>▶ Empezar simulacro</button></div></div>`}
function study(){const q=S.list[S.i];if(!q)return`<div class="card"><h1>Sesión terminada</h1><p>Aciertos: ${S.ok} de ${S.list.length}</p>${S.fl&&S.fl.length?`<div class="m">Copiar las ${S.fl.length} falladas para tu IA:</div><div class="row" style="margin-bottom:10px">${aiBtns('data-aiset="s"')}</div>`:''}<button class="p" data-home>Volver al inicio</button></div>`;const p=S.cur;if(S.ar&&!S.rv&&!p)return recall(q);
 let h=`<div class="m">${esc(q.examen)} · pregunta ${q.numero} · ${S.i+1}/${S.list.length}${q.esp?' · '+esc(q.esp):''}</div><div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div><div class="card"><p>${esc(q.en)}</p>${q.im.map(s=>`<img class="q" src="${s}">`).join('')}`;
 q.op.forEach((o,i)=>{const n=i+1;let c='opt';if(p){if(n===q.ok)c+=' ok';else if(n===p.sel)c+=' ko'}
  h+=`<button class="${c}" data-a="${n}" ${p?'disabled':''}>${n}. ${esc(o)}</button>`;if(p&&q.js[i])h+=`<div class="m" style="margin:0 0 6px 10px">${esc(q.js[i])}</div>`});
 if(p)h+=`<p><b>${p.ok?'✔ Correcta':'✘ Incorrecta'}</b> ${esc(q.ex)}</p>${S.ar&&S.rt?`<p class="m">🧠 Tu respuesta de memoria: ${esc(S.rt)}</p>`:''}`;
 return h+`${p?`<div class="m" style="margin-top:10px">¿No lo entendiste? Copia la pregunta para tu IA:</div><div class="row">${aiBtns(`data-aiq="${q.id}"`)}</div>`:''}</div><div class="row"><button data-home>Salir</button>${p?'<button class="p" data-next>Siguiente</button>':''}</div>`}
let cmo=0;
const logDay=(n,ok)=>{const l=JSON.parse(localStorage.bm_log||'{}'),t=ds(new Date()),x=l[t]||{n:0,ok:0};x.n+=n;x.ok+=ok;l[t]=x;localStorage.bm_log=JSON.stringify(l)};
function dayMap(){const m={};Object.values(P).forEach(p=>{const k=ds(new Date(p.t)),x=m[k]||(m[k]={n:0,ok:0});x.n++;if(p.ok)x.ok++});const l=JSON.parse(localStorage.bm_log||'{}');for(const k in l){const x=m[k]||(m[k]={n:0,ok:0});x.n=Math.max(x.n,l[k].n);x.ok=Math.max(x.ok,l[k].ok)}return m}
function stats(){const m=dayMap(),st=stz(),goal=gs().goal,ks=Object.keys(m).sort(),tot=ks.reduce((a,k)=>a+m[k].n,0),okT=ks.reduce((a,k)=>a+m[k].ok,0),pc=(a,b)=>b?Math.round(a/b*100):0;
 const sk=new Set();let gk='';if(st.g){const g=new Date(st.g+'T12:00:00');g.setDate(g.getDate()-1);gk=ds(g)}
 if(st.last){let c=0,dt=new Date(st.last+'T12:00:00');while(c<st.n&&sk.size<400){const k=ds(dt);if(k!==gk){sk.add(k);c++}dt.setDate(dt.getDate()-1)}}
 const card=(a,b)=>`<div class="card" style="flex:1;min-width:90px;text-align:center;padding:10px"><div style="font-size:22px;font-weight:700">${a}</div><div class="m">${b}</div></div>`;
 let h=`<div class="row" style="justify-content:space-between"><b style="font-size:18px">📊 Estadísticas</b><button data-home>Volver</button></div><div class="row" style="flex-wrap:wrap;gap:8px;margin:10px 0">${card('🔥 '+cur().n,'racha actual')}${card('🏆 '+st.best,'mejor racha')}${card(ks.length,'días activos')}${card(tot,'respondidas')}${card(pc(okT,tot)+'%','aciertos')}${card(ks.length?Math.round(tot/ks.length):0,'por día activo')}</div>`;
 const b=new Date();b.setMonth(b.getMonth()+cmo,1);const Y=b.getFullYear(),M=b.getMonth(),off=(b.getDay()+6)%7,nd=new Date(Y,M+1,0).getDate();
 h+=`<div class="card"><div class="row" style="justify-content:space-between"><button data-cm="-1">‹</button><b>${new Date(Y,M,1).toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button data-cm="1">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px">${['L','M','M','J','V','S','D'].map(x=>`<div class="m">${x}</div>`).join('')}${'<div></div>'.repeat(off)}`;
 for(let d=1;d<=nd;d++){const k=ds(new Date(Y,M,d)),x=m[k],a=x?Math.min(1,.2+.8*x.n/goal):0;h+=`<div title="${x?x.n+' respondidas · '+pc(x.ok,x.n)+'% aciertos':'Sin actividad'}" style="aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${x?'rgba(34,197,94,'+a+')':'rgba(128,128,128,.12)'};${sk.has(k)?'outline:2px solid #f59e0b;':''}">${d}<span style="font-size:9px">${k===gk?'🛡️':x?x.n:''}</span></div>`}
 h+=`</div><div class="m" style="margin-top:8px">Verde: preguntas del día (más oscuro = más cerca de tu meta de ${goal}) · Borde naranja: días de tu racha · 🛡️ día de gracia</div></div>`;
 const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ds(d);days.push([d.getDate(),m[k]||{n:0,ok:0}])}
 const mx=Math.max(5,...days.map(x=>x[1].n));h+=`<div class="card"><b>Últimos 14 días</b><svg viewBox="0 0 336 130" style="width:100%;margin-top:8px">${days.map(([d,x],i)=>{const H=x.n/mx*90,o=x.ok/mx*90;return`<rect x="${i*24+3}" y="${100-H}" width="18" height="${H-o}" rx="2" fill="#ef4444"/><rect x="${i*24+3}" y="${100-o}" width="18" height="${o}" rx="2" fill="#22c55e"/><text x="${i*24+12}" y="114" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">${d}</text>${x.n?`<text x="${i*24+12}" y="${96-H}" font-size="8" text-anchor="middle" fill="currentColor">${x.n}</text>`:''}`}).join('')}</svg><div class="m">🟩 aciertos · 🟥 fallos</div></div>`;
 const A={};Q.forEach(q=>{const a=q.esp||q.especialidad||'Sin área',x=A[a]||(A[a]={n:0,ok:0,t:0});if(!q.anulada)x.t++;if(P[q.id]){x.n++;if(P[q.id].ok)x.ok++}});
 const rows=Object.entries(A).filter(e=>e[1].n).sort((a,b)=>b[1].n-a[1].n),ma=Math.max(1,...rows.map(e=>e[1].n));
 h+=`<div class="card"><b>Áreas respondidas</b>${rows.length?rows.map(([a,x])=>{const p=pc(x.ok,x.n),c=p>=70?'#22c55e':p>=50?'#f59e0b':'#ef4444';return`<div style="margin-top:10px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(a)}</span><span class="m">${x.ok}/${x.n} · ${p}%${x.t?' · de '+x.t:''}</span></div><div style="height:10px;border-radius:5px;background:rgba(128,128,128,.18)"><div style="height:100%;width:${x.n/ma*100}%;border-radius:5px;background:${c}"></div></div></div>`}).join(''):'<div class="m">Responde preguntas para ver tus áreas.</div>'}<div class="m" style="margin-top:8px">Verde ≥70 % · naranja ≥50 % · rojo &lt;50 % de aciertos. Cuenta la última respuesta de cada pregunta.</div></div>`;
 return h}
document.addEventListener('click',e=>{const a=e.target.closest('[data-stats]'),c=e.target.closest('[data-cm]');if(a){V='stats';render()}else if(c){cmo+=+c.dataset.cm;render()}});
 const render=()=>{$('#app').innerHTML=V==='home'?home():V==='setup'?setup():V==='sim'?simq():V==='res'?res():V==='stats'?stats():study();scrollTo(0,0)};
const toast=m=>alert(m);
document.addEventListener('click',async e=>{const t=e.target,d=t.dataset;
 if(t.matches('img.q')){$('#z img').src=t.src;$('#z').style.display='flex';return}
 if(t.closest('#z')){$('#z').style.display='none';return}
 if(d.study!=null){S={e:d.study,b:'',s:'',f:'',r:false};V='setup';render()}
 else if(d.home!=null){V='home';render()}
 else if(d.go!=null){S.list=pick();if(!S.list.length)return toast('No hay preguntas con esos filtros.');if(S.r)S.list.sort(()=>Math.random()-.5);S.i=0;S.ok=0;S.fl=[];S.cur=null;S.rv=false;S.rt='';V='study';render()}
 else if(d.a){const q=S.list[S.i],n=+d.a,r=mk(q.id,n,n===q.ok);P[q.id]=r;S.cur=r;if(r.ok)S.ok++;else(S.fl=S.fl||[]).push([q,n]);sfx(r.ok);await putMany('p',[r]);logDay(1,r.ok?1:0);addDaily(1);render()}
 else if(d.next!=null){S.i++;S.cur=null;S.rv=false;S.rt='';render()}
 else if(d.del){if(confirm(`¿Borrar "${d.del}" con todo su progreso?`)){const ids=Q.filter(q=>q.examen===d.del).map(q=>q.id);await delMany('q',ids);await delMany('p',ids);await load();render()}}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.k){S[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;render()}
 else if(t.id==='fq'){let n=0;for(const f of t.files)try{const j=JSON.parse(await f.text()),a=Array.isArray(j)?j:j.preguntas||[],ex=j.examen;const m=a.map(x=>norm(x,ex));await putMany('q',m);n+=m.length}catch(_){toast('Archivo no válido: '+f.name)}
  await load();render();toast(n+' preguntas importadas.')}});
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let AC,snd=localStorage.bm_snd!=='0',ST;
const tone=(f,t,d,v=.15,ty='sine')=>{if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}catch(_){}};
const sfx=ok=>ok?(tone(659,0,.18),tone(880,.1,.18),tone(1319,.2,.35)):(tone(220,0,.25,.12,'triangle'),tone(165,.12,.35,.12,'triangle'));
let BW;const beep=n=>{if(!snd)return;try{if(!BW){const sr=22050,x=new Float32Array(sr),L=sr*.18|0;for(let k=0;k<3;k++)for(let i=0;i<L;i++)x[(k*sr*.25|0)+i]=Math.sin(6.2832*880*i/sr)*.4*Math.min(1,i/200)*Math.min(1,(L-i)/400);BW=URL.createObjectURL(wav(x,x,sr))}new Audio(BW).play().catch(()=>{for(let i=0;i<n;i++)tone(880,i*.25,.18,.2)})}catch(_){}};

 const u=await wavFor(t);if(AST!==t)return;if(AEL.dataset.t!==t){AEL.src=u;AEL.dataset.t=t}AEL.volume=vol();AEL.play().catch(()=>{if(AST===t)AST=null});ms()}
function ambSync(){const want=amb.s!=='off'&&!ambHold&&(!amb.l||(pm.end&&pm.m==='w')||Date.now()<pvUntil);if(!want){if(AST)ambStop();return}if(AST!==amb.s)ambStart(amb.s)}
/* ===== Notificación multimedia (fuera de la app) y ventana flotante ===== */
function ms(){if(!('mediaSession'in navigator))return;try{const T=PM[pm.m],mn=Math.ceil(pm.left/6e4);navigator.mediaSession.metadata=new MediaMetadata({title:(pm.m==='w'?'🍅 Foco':'☕ Pausa')+' · quedan '+mn+' min',artist:'Exámenes de residencia',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});navigator.mediaSession.playbackState=pm.end?'playing':'paused';navigator.mediaSession.setPositionState({duration:T/1e3,position:Math.max(0,Math.min(T,T-pm.left))/1e3,playbackRate:1})}catch(_){}}
if('mediaSession'in navigator){const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(_){}};h('play',()=>{ambHold=false;if(!pm.end)pmAct('t');else ambSync()});h('pause',()=>{if(pm.end)pmAct('t');ambHold=true;ambStop()});h('previoustrack',()=>pmAct('r'));h('nexttrack',()=>pmAct('m'))}
function drawPip(){if(!PV)return;const x=PV.c.getContext('2d'),[m,q]=fmt(pm.left).split(':');x.setTransform(1.5,0,0,1.5,0,0);x.fillStyle='#111418';x.fillRect(0,0,200,420);x.textAlign='center';x.textBaseline='middle';x.fillStyle=pm.end?(pm.m==='w'?'#fff':'#6d9bff'):'#8a939e';let z=170;do{x.font='600 '+z+'px system-ui,sans-serif';z-=6}while(x.measureText(m).width>176&&z>40);x.fillText(m,100,108);x.fillText(q,100,312);x.fillStyle='#ffffff33';x.fillRect(60,209,80,3)}
function pipUpd(){if(PW){const d=PW.document,a=d.getElementById('pz');if(a){a.textContent=fmt(pm.left);a.style.color=pm.m==='w'?'#fff':'#6d9bff';a.style.opacity=pm.end?1:.55;d.getElementById('pp').textContent=pm.end?'⏸':'▶'}}drawPip()}
async function pip(){if(PW){PW.close();return}if(PV){try{await document.exitPictureInPicture()}catch(_){}PV.remove();PV=null;return}
 try{if(window.documentPictureInPicture){const w=PW=await documentPictureInPicture.requestWindow({width:200,height:90});
   w.document.head.innerHTML='<style>body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;background:#111418;color:#e8eaed;font-family:system-ui,sans-serif;overflow:hidden}#pz{font-weight:600;font-size:min(17vw,58vh);font-variant-numeric:tabular-nums;cursor:pointer;line-height:1;white-space:nowrap}#pc{display:flex;gap:1.5vw}button{font-size:min(6vw,22vh);padding:.2em .7em;border-radius:99px;border:0;background:#2c323a;color:#fff;cursor:pointer;line-height:1.2}@media(max-height:75px){#pc{display:none}}</style>';
   w.document.body.innerHTML='<div id="pz" data-pm="t" title="Pausar / reanudar"></div><div id="pc"><button id="pp" data-pm="t"></button><button data-pm="r">↺</button><button data-pm="m">⇄</button></div>';
   w.document.addEventListener('click',e=>{const b=e.target.closest('[data-pm]');if(b)pmAct(b.dataset.pm)});w.addEventListener('pagehide',()=>{PW=null});w.setInterval(tick,500);pipUpd()}
  else if(document.pictureInPictureEnabled){const c=document.createElement('canvas');c.width=300;c.height=630;PV=document.createElement('video');PV.c=c;PV.muted=true;PV.playsInline=true;PV.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(PV);drawPip();PV.srcObject=c.captureStream(2);await PV.play();await PV.requestPictureInPicture();PV.addEventListener('leavepictureinpicture',()=>{if(PV)PV.remove();PV=null})}
  else bn('Tu navegador no permite ventana flotante.')}catch(_){if(PV){PV.remove();PV=null}bn('No se pudo abrir la ventana flotante en este navegador.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.pm==='f')pip()});
const am=()=>`<div class="m" style="margin-top:10px">🎧 Sonido de fondo</div><div class="row">${[['off','Off'],['rain','🌧 Lluvia'],['brown','🟤 Marrón']].map(([k,t])=>`<button style="padding:7px 10px" class="${amb.s===k?'on':''}" data-as="${k}">${t}</button>`).join('')}</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><span>🔈</span><input type="range" id="av" min="0" max="100" value="${Math.round(amb.v*100)}" style="flex:1;min-width:0;accent-color:var(--a)"></div><label class="m" style="font-size:13px"><input type="checkbox" data-al ${amb.l?'checked':''}> Solo durante el foco (se apaga en la pausa)</label>`;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.as){amb.s=b.dataset.as;ambHold=false;saveAmb();pvUntil=Date.now()+3000;hdr()}ambSync()});
document.addEventListener('input',e=>{if(e.target.id==='av'){amb.v=e.target.value/100;pvUntil=Date.now()+2500;if(AEL)AEL.volume=vol();ambSync()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='av')saveAmb();else if(t.dataset.al!=null){amb.l=t.checked;saveAmb();ambSync()}});
ST=cur();open().then(load).then(()=>{render();hdr();tick();fetch('catalogo.json',{cache:'no-cache'}).then(r=>r.json()).then(c=>{CAT=c;syncCat();if(V==='home')render()}).catch(()=>{})});

/* ===== Copiar para IA (niveles) =====
   Para quitar un nivel: borra su entrada en AI. Para quitar todo: borra este bloque
   y los 3 usos de aiBtns(...) en study(), rc() y res(). */
const AI_BASE='Soy estudiante de medicina y me preparo para el examen de residencia (MIR). Abajo hay preguntas de mi banco, con mi respuesta, la respuesta correcta y las justificaciones del banco. Esas justificaciones son la fuente de verdad: si algo te parece dudoso o contradictorio, dilo en vez de inventar. Si una pregunta tenía imagen, no puedo adjuntarla: asume el hallazgo más probable según las opciones y avísame de que lo asumes.';
const AI={
 a:{b:'📖 Aprende',p:AI_BASE+'\n\nNO quiero una clase completa: solo lo necesario para acertar si la pregunta reaparece. Trabajemos de a una pregunta. Para cada una: (1) primero pídeme que intente predecir o completar el razonamiento y espera mi respuesta; (2) luego dame, en pocas líneas, la idea clave mínima, la pista del enunciado que lleva a la correcta y cómo suelen plantearlo en el examen; (3) explica por qué la opción que marqué era tentadora pero incorrecta. Al terminar cada pregunta, hazme 2 preguntas cortas de comprobación (una con un diagnóstico diferencial parecido) y no me des la respuesta hasta que yo conteste. Pasa a la siguiente cuando te lo diga.'},
 d:{b:'🧱 Desde cero',p:AI_BASE+'\n\nNo he estudiado bien este tema. Para cada pregunta: (1) explícame desde cero los conceptos previos necesarios (definiciones, fisiología o anatomía básica), en orden y con lenguaje simple, con un ejemplo clínico; (2) luego por qué la correcta lo es y por qué cada distractor no; (3) cierra con 3 puntos para memorizar y 2 preguntas de comprobación sin darme la respuesta hasta que yo conteste. Si el tema es muy amplio, limítate a lo que ayuda a responder esta pregunta y otras parecidas, y dime qué subtemas quedan para después. Trabajemos de a una pregunta.'}
};
const aiBtns=a=>Object.entries(AI).map(([k,v])=>`<button data-ai="${k}" ${a}>${v.b}</button>`).join('');
function aiQ(q,i,sel){
 let t=`### Pregunta ${i} (${q.examen} #${q.numero}${q.esp?', '+q.esp:''})\n${q.en}\n`;
 if(q.im.length)t+=`[Esta pregunta incluía ${q.im.length} imagen(es) que no se pueden adjuntar]\n`;
 q.op.forEach((o,j)=>t+=`${j+1}. ${o}\n`);
 t+=`Mi respuesta: ${sel?sel+'. '+(q.op[sel-1]||''):'en blanco / no supe'}\nRespuesta correcta: ${q.ok}. ${q.op[q.ok-1]||''}\n`;
 const js=q.js.map((x,j)=>x?`- Opción ${j+1}: ${x}`:'').filter(Boolean);
 if(js.length)t+='Justificaciones del banco:\n'+js.join('\n')+'\n';
 if(q.ex)t+=`Explicación del banco: ${q.ex}\n`;
 return t}
const aiText=(items,k)=>AI[k].p+'\n\n---\n\n'+items.map(([q,sel],i)=>aiQ(q,i+1,sel)).join('\n');
function aiShow(t){
 let o=document.getElementById('aibox');if(o)o.remove();
 o=document.createElement('div');o.id='aibox';o.style.cssText='position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px';
 o.innerHTML='<div class="card" style="width:100%;max-width:640px"><p class="m">No pude copiar solo. Selecciona todo el texto y cópialo:</p><textarea id="aitx" rows="10" readonly></textarea><p><button class="p" id="aiok">Cerrar</button></p></div>';
 document.body.appendChild(o);const x=o.querySelector('#aitx');x.value=t;x.focus();x.select();
 o.querySelector('#aiok').onclick=()=>o.remove()}
document.addEventListener('click',async e=>{
 const b=e.target.closest&&e.target.closest('button[data-ai]');if(!b)return;
 const d=b.dataset;if(!AI[d.ai])return;let items=[];
 if(d.aiq){const q=S.list.find(x=>x.id===d.aiq);if(q)items=[[q,V==='res'?S.sa[q.id]:(P[q.id]||{}).sel]]}
 else if(d.aiset==='s')items=S.fl||[];else if(d.aiset)items=S.list.filter(q=>!q.anulada&&(d.aiset==='a'||S.sa[q.id]!==q.ok)).map(q=>[q,S.sa[q.id]]);
 if(!items.length)return bn('No hay preguntas para copiar.');
 const t=aiText(items,d.ai);
 try{await navigator.clipboard.writeText(t);bn('📋 Copiado. Pégalo en tu IA.')}catch(_){aiShow(t)}
});
